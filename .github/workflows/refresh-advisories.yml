name: Refresh advisory snapshot

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Fetch advisories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m mcp_sdk_audit --update-snapshot src/mcp_sdk_audit/data/advisories.json
      - name: Summarize new advisories
        id: diff
        run: |
          {
            echo 'body<<EOF'
            echo 'Automated refresh of the bundled advisory snapshot from the GitHub Advisory Database.'
            echo
            git diff -U0 src/mcp_sdk_audit/data/advisories.json | grep -E '^\+\s+"(ghsa|summary)"' | sed 's/^+\s*/- /' || true
            echo
            echo 'Check whether any new advisory needs a source rule (upgrade alone not enough).'
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - id: cpr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: chore/refresh-advisories
          commit-message: "chore: refresh advisory snapshot"
          title: "chore: refresh advisory snapshot"
          body: ${{ steps.diff.outputs.body }}
          labels: advisories
      - name: Run CI on the refresh PR
        # PRs opened with GITHUB_TOKEN don't trigger pull_request workflows; dispatch CI on the branch instead.
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref chore/refresh-advisories
