name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The advisory-refresh PR is opened with GITHUB_TOKEN, which does not trigger pull_request runs.
  # refresh-advisories.yml dispatches this workflow on the PR branch so the PR gets checks.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  action:
    name: action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the vulnerable fixture (must fail)
        id: bad
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/vulnerable
          upload-sarif: "false"
      - name: Scan the fixed fixture (must pass)
        uses: ./
        with:
          path: tests/fixtures/fixed
          upload-sarif: "false"
      - name: Check outcomes
        env:
          BAD: ${{ steps.bad.outcome }}
        run: test "$BAD" = "failure"
